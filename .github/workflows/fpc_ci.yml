name: FPC Core CI (Phase-F / F0)

# Purpose: prove that the UI-independent core of Dev-Cpp-Modern builds and
# passes its smoke tests under Free Pascal on both Windows and Linux, with
# zero Embarcadero / commercial toolchain involvement. This is the executable
# form of the F0 milestone in doc/FPC-Lazarus渐进式移植实施方案.md.
#
# Exit criteria of F0:
#   * fpc-core (ubuntu-latest)     -> portable core compiles + tests pass
#   * fpc-core (windows-latest)   -> same, plus the Win32-only toolchain unit
#   * qa-gate-profiles            -> Delphi and FPC dialect gates both green
#   * lcl-svg-runtime (windows)   -> the converted LFMs LOAD: 116 icons draw, and
#                                    the 20 extracted theme PNGs decode with ink
#   * f3-form-ratchet             -> the 53 forms do not become less convertible
#
# f3-form-ratchet is text analysis only -- no Lazarus, no Pascal compiler. It
# answers the question the F3 estimate depends on: of the 53 self-authored .dfm,
# how many can a DFM converter read without a control it has never heard of.
#
# lcl-svg-runtime is the odd one out and the reason this workflow exists in
# this shape: it is the only job that RUNS converted output. Every other check
# here parses text, and this project has been caught four times by text that
# parses perfectly and does nothing -- an extractor that lost 12x of the icon
# data, a control whose LoadSvgLists never loaded anything, a converted .lfm set
# whose provenance header made every file unreadable to the LCL, and a
# `TBitmap.Assign` that rejects a decoded PNG with "Cannot assign a TPicture to
# a TBitmap", which is what the 20 extracted theme images hit on their first
# real run.

on:
  push:
    branches: [master, main, phase4-lsp-modernize]
    paths:
      - "Source/Core/**"
      - "Source/Debugger/**"
      - "Source/Toolchain/**"
      - "Source/Fpc/**"
      - "Tests/FpcCoreTests/**"
      - "tools/qa_check.py"
      - "tools/f3_form_survey.py"
      - "tools/f3_form_ratchet.py"
      - "tools/f3_probe_inject.py"
      - "tools/f3_retirement_check.py"
      - "tools/f3_compile_cost.py"
      - "tools/f3_batch_plan.py"
      - "tools/f3_external_matrix.py"
      - "tools/f3_probe_inject.py"
      - "tools/f3_load_routes.py"
      - "tools/f3_form_baseline.txt"
      - "tools/f3_svg_extract.py"
      - "tools/lcl_svg_struct_check.py"
      - "tools/f3_imageindex_audit.py"
      - "tools/f3_removed_controls.py"
      - "tools/f3_svg_semantics.py"
      - "tools/f3_lfm_check.py"
      - "tools/f3_dfm_to_lfm.py"
      - "tools/f3_image_extract.py"
      - "tools/f3_imgcoll_check.py"
      - "tools/build_svg_probe.ps1"
      - "tools/build_form_probe.ps1"
      - "tools/build_syn_probe.ps1"
      - "tools/f3_namespace_alias.py"
      - "tools/f3_namespace_alias_baseline.json"
      - "tools/f3_ppu_surface.py"
      - "tools/f3_ppu_surface_baseline.json"
      - "tools/f3_shim_feasibility.py"
      - "Source/Fpc/UI/Compat/**"
      - "Source/Fpc/UI/Controls/SynHighlighterRc.pas"
      - "Tests/FpcCoreTests/svg/**"
      - "Tests/FpcCoreTests/imgcoll/**"
      - "Tests/FpcCoreTests/forms/**"
      - "Tests/FpcCoreTests/syn/**"
      - "Source/**/*.dfm"
      - ".github/workflows/fpc_ci.yml"
  pull_request:
    paths:
      - "Source/Core/**"
      - "Source/Debugger/**"
      - "Source/Toolchain/**"
      - "Source/Fpc/**"
      - "Tests/FpcCoreTests/**"
      - "tools/qa_check.py"
      - "tools/f3_form_survey.py"
      - "tools/f3_form_ratchet.py"
      - "tools/f3_probe_inject.py"
      - "tools/f3_retirement_check.py"
      - "tools/f3_compile_cost.py"
      - "tools/f3_batch_plan.py"
      - "tools/f3_external_matrix.py"
      - "tools/f3_probe_inject.py"
      - "tools/f3_load_routes.py"
      - "tools/f3_form_baseline.txt"
      - "tools/f3_svg_extract.py"
      - "tools/lcl_svg_struct_check.py"
      - "tools/f3_imageindex_audit.py"
      - "tools/f3_removed_controls.py"
      - "tools/f3_svg_semantics.py"
      - "tools/f3_lfm_check.py"
      - "tools/f3_dfm_to_lfm.py"
      - "tools/f3_image_extract.py"
      - "tools/f3_imgcoll_check.py"
      - "tools/build_svg_probe.ps1"
      - "tools/build_form_probe.ps1"
      - "tools/build_syn_probe.ps1"
      - "tools/f3_namespace_alias.py"
      - "tools/f3_namespace_alias_baseline.json"
      - "tools/f3_ppu_surface.py"
      - "tools/f3_ppu_surface_baseline.json"
      - "tools/f3_shim_feasibility.py"
      - "Source/Fpc/UI/Compat/**"
      - "Source/Fpc/UI/Controls/SynHighlighterRc.pas"
      - "Tests/FpcCoreTests/svg/**"
      - "Tests/FpcCoreTests/imgcoll/**"
      - "Tests/FpcCoreTests/forms/**"
      - "Tests/FpcCoreTests/syn/**"
      - "Source/**/*.dfm"
  workflow_dispatch:

permissions:
  contents: read

env:
  LAZ_VERSION: "4.4"

jobs:
  fpc-core:
    name: FPC core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Lazarus / Free Pascal
        uses: gcarreno/setup-lazarus@v3
        with:
          laz-version: ${{ env.LAZ_VERSION }}

      - name: Build portable core (lazbuild)
        shell: bash
        run: lazbuild --build-all --no-write-project Tests/FpcCoreTests/FpcCorePortable.lpi

      - name: Run core smoke tests
        shell: bash
        run: |
          set -e
          BIN=$(find Tests/FpcCoreTests/lib -maxdepth 2 -type f \
                \( -name 'FpcCoreTests' -o -name 'FpcCoreTests.exe' \) | head -n 1)
          if [ -z "$BIN" ]; then
            echo "::error::core test binary not found"
            find Tests/FpcCoreTests/lib -type f || true
            exit 1
          fi
          echo "running $BIN"
          "$BIN"

  fpc-toolchain:
    name: FPC core + Win32 toolchain (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Lazarus / Free Pascal
        uses: gcarreno/setup-lazarus@v3
        with:
          laz-version: ${{ env.LAZ_VERSION }}

      - name: Build Windows variant (ToolchainConfig uses Win32 pipes)
        shell: bash
        run: lazbuild --build-all --no-write-project Tests/FpcCoreTests/FpcCoreWin.lpi

      - name: Run Windows-variant smoke tests
        shell: bash
        run: |
          set -e
          BIN=$(find Tests/FpcCoreTests/lib -maxdepth 2 -type f \
                \( -name 'FpcCoreTestsWin' -o -name 'FpcCoreTestsWin.exe' \) | head -n 1)
          if [ -z "$BIN" ]; then
            echo "::error::win test binary not found"
            find Tests/FpcCoreTests/lib -type f || true
            exit 1
          fi
          "$BIN"

  qa-gate-profiles:
    name: QA gate (delphi + fpc profiles)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Delphi profile (must stay green: no FPC traces in the Delphi tree)"
        run: python3 tools/qa_check.py --profile delphi

      - name: "FPC profile (allows TProcess / LCL idioms in migration work)"
        run: python3 tools/qa_check.py --profile fpc

      - name: "F0 artifact structure check (no Lazarus needed)"
        run: python3 tools/fpc_artifact_check.py

      # Both of these need no compiler, so they belong in the gate job rather
      # than waiting on the Lazarus jobs. The first verifies the extracted SVG
      # data still round-trips from DataFrm.dfm; the second verifies the STRUCTURE
      # of the LCL control that will consume it.
      #
      # The --self-test step comes first deliberately: it asserts that each of
      # that gate's checks can actually FAIL. The first version of the gate had
      # only ever printed OK -- over a file that contained six defects no compiler
      # would have accepted -- so a check that has never failed is treated as
      # unproven until it is shown to fail on a deliberately broken input.
      - name: "SVG data round-trip from the DFM (no Lazarus needed)"
        run: python3 tools/f3_svg_extract.py --verify

      - name: "LCL SVG structural gate -- prove the checks can fail"
        run: python3 tools/lcl_svg_struct_check.py --self-test

      - name: "LCL SVG structural gate"
        run: python3 tools/lcl_svg_struct_check.py

      # ImageIndex topology: every ImageIndex in the tree, classified, with the
      # SVG-bound ones range-asserted against the extracted icon counts. Fails on
      # an out-of-bounds index, a negative that is not the -1 sentinel, or an
      # Images assignment naming a list the extractor never saw.
      #
      # Deliberately NOT applied to all 188 sites. 57 bind an SVG list; the rest
      # are -1 "no icon" markers or belong to non-SVG lists, and asserting those
      # would bury the 57 that matter in 123 false alarms.
      - name: "ImageIndex topology ledger (no out-of-bounds)"
        run: python3 tools/f3_imageindex_audit.py

      # Icon SEMANTICS: one action must use one icon, everywhere it appears.
      # Separate from the range audit on purpose -- that one proves in-range, this
      # one proves the 57 sites are internally consistent. Exits 0 and reports
      # rather than fails, because a shared CONTROL NAME across two unrelated
      # forms (btnBrowse picking a compiler path vs a project icon) is ordinary
      # Delphi practice and predates the port.
      - name: "SVG icon semantic consistency"
        run: python3 tools/f3_svg_semantics.py

      # LFM conversion: no residual VCL-only properties, object tree identical to
      # the source, CRLF and no BOM, no comment header (TParser accepts no
      # comment syntax -- see f3_dfm_to_lfm.py), every file accounted for in
      # _generated.json, and every SVG list a consumer form binds to actually
      # declared by a generated fragment.
      - name: "LFM conversion + SVG binding check"
        run: python3 tools/f3_lfm_check.py

      # The TVirtualImage half of step 3. Same shape as the SVG checks above:
      # the extractor round-trips the payload from DataFrm.dfm byte for byte,
      # and the gate confirms every VCL node in the tree actually became a
      # TLclVirtualImage -- including the rule that dropping `ImageHeight` is
      # only safe while it is 0.
      #
      # Both are text gates; neither decodes a PNG. The runtime job below is
      # what does that, and this split is deliberate: a green static gate here
      # says nothing about whether the widgetset accepts the bytes, which is
      # exactly the gap this project has fallen into before.
      - name: "TImageCollection payload round-trips from the DFM"
        run: python3 tools/f3_image_extract.py --verify

      - name: "TVirtualImage conversion gate"
        run: python3 tools/f3_imgcoll_check.py

      # ONE retirement set, one home (F3-7).
      #
      # Two tools answer "which forms are still blocked", and for most of
      # 2026-10 they answered differently on the same tree: the route tool
      # subtracted a local RETIRED set and called LangFrm/EnviroFrm CLEARED,
      # while f3_batch_plan.py had no such set and reported them as blocked by
      # TVirtualImage -- a class F3-3 had already replaced and load-tested.
      # Nothing failed; the two just disagreed. This asserts the set has one
      # declaration site, that both instruments agree on the forms the
      # retirements decided, and that every rename in the converter's
      # CLASS_RENAME is recorded -- the reverse direction, which is the one
      # with teeth.
      - name: "Retirement set is single-sourced and both tools agree"
        run: python3 tools/f3_retirement_check.py

      # ...and that it can fail. A fork re-introduced in either tool, and a
      # converter rename with no retirement entry, must both be reported.
      - name: "Retirement gate self-test (each check can fail)"
        run: python3 tools/f3_retirement_check.py --self-test

      # The compile-surface ratchet (F3-7).
      #
      # doc F3-SVG section 18 measured the thing four sprints of planning had
      # been estimating -- what it costs to compile ONE form -- and the answer
      # was "all of it, every time": 13 of 13 CLEARED forms share one closure of
      # 81 self-authored units / 49,223 LOC, reached through
      # devcfg -> MainUi -> main. A number that large has to be watched or the
      # next innocuous `uses` clause spends it silently.
      #
      # Only GROWTH fails. A shrink is progress, and like every ratchet here it
      # is never auto-accepted -- --write-baseline is a deliberate act, because
      # the tempting move is to re-baseline downward the first time a tool
      # miscounts. It miscounted once already (the tokeniser split dotted unit
      # names, under-reporting by 17 units), which is exactly why it is a gate
      # with an injection test rather than a number in a wiki.
      - name: "Compile-surface closure floor (must not grow)"
        run: python3 tools/f3_compile_cost.py --ratchet

      # The CompOptions frame-port (F3-4). A negative assertion, and it
      # asserts on the UNIT name for TCompOptionsList: the vendored control
      # stays on disk (DevCpp.dpk needs it) while nothing may use it, and the
      # string a uses clause contains is `CompOptionsList`, which does not
      # contain `TCompOptionsList`. The first version of this entry asserted
      # only the type name and the injection test put the unit straight back
      # into CompOptionsFrm.pas with the gate still green.
      - name: "Retired-control guard (TAnimate / TDdeServerConv / TCompOptionsList)"
        run: python3 tools/f3_removed_controls.py

  # ---------------------------------------------------------------------------
  # The SVG work is the only part of F3 that has ever been RUN rather than
  # parsed. It needs a compiled LCL and fpvectorial, which the stock Lazarus
  # install does not ship: `lcl/units/` contains the IDE's own 288 units and
  # neither graphics.ppu nor fpvectorial.ppu. Both packages are built first --
  # measured locally, both exit 0 and both are required (doc F3-SVG section
  # 11.1). Without them every probe below fails to compile, and the message
  # ("Can't find unit Interfaces") reads as "Lazarus is not installed".
  #
  # Windows-only, and that is a stated limitation rather than a choice: the
  # probe build is tools/build_svg_probe.ps1, which hard-codes the win32 unit
  # directories and the x86_64-win64 fpc. Porting it is a separate piece of work
  # that has NOT been done, so no green Linux badge is claimed here.
  # ---------------------------------------------------------------------------
  lcl-svg-runtime:
    name: LCL SVG runtime (lcm loads the generated LFM)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Lazarus / Free Pascal
        uses: gcarreno/setup-lazarus@v3
        with:
          laz-version: ${{ env.LAZ_VERSION }}

      - name: Build the LCL (win32 widgetset)
        shell: pwsh
        run: lazbuild --ws=win32 C:\lazarus\lcl\interfaces\lcl.lpk
        continue-on-error: false

      - name: Build fpvectorial (the SVG parser and canvas renderer)
        shell: pwsh
        run: lazbuild C:\lazarus\components\fpvectorial\fpvectorialpkg.lpk

      # Regenerates SvgData.pas + svg_manifest.json and rewrites every .lfm,
      # so this job also proves the converters are reproducible from a clean
      # checkout rather than depending on committed artefacts.
      - name: "Regenerate the SVG data and the converted LFM"
        shell: pwsh
        run: |
          python tools/f3_svg_extract.py --verify
          python tools/f3_image_extract.py
          python tools/f3_dfm_to_lfm.py --only batch-a
          python tools/f3_dfm_to_lfm.py --only svg --emit-svg-lists --emit-vimage-fragment
          # Packman/Main.dfm carries TSVGIconImageCollection and
          # TSVGIconVirtualImageList, which have no LCL counterpart, so the
          # converter refuses it and exits 1 BY DESIGN. Assert that rather than
          # letting a working gate look like a red one.
          if ($LASTEXITCODE -ne 1) { throw "expected the Packman/Main refusal, got $LASTEXITCODE" }

      - name: "Build the SVG probes"
        shell: pwsh
        run: ./tools/build_svg_probe.ps1 -Target all

      # Three questions, three programs. DataProbe: do the 117 payloads reach
      # the program at all. ListProbe: does the control rasterise them (0
      # failures is a hard assertion, not a reported ceiling). LfmProbe: does
      # the file the CONVERTER wrote stream through the real LCL reader with
      # every icon drawn -- the check no structural gate could stand in for.
      - name: "SVG data arrives (6 lists / 117 payloads)"
        shell: pwsh
        run: ./Tests/FpcCoreTests/svg/SvgDataProbe.exe

      - name: "TLclSvgImageList rasterises every icon (expect 0 failures)"
        shell: pwsh
        run: ./Tests/FpcCoreTests/svg/SvgListProbe.exe

      - name: "the generated .svg-lists.lfm loads and draws (expect PASS)"
        shell: pwsh
        run: ./Tests/FpcCoreTests/svg/SvgLfmProbe.exe

      # RasterProbe deliberately BYPASSES the control and feeds SvgData straight
      # to fpvectorial, so it still reports the 7 zero-chord failures. That is
      # the design (the control normalises them in Rasterise), and it is the
      # reason this job runs all four: a RasterProbe that started reporting 0
      # would mean somebody "fixed" the data and silently moved the invariant.
      - name: "RasterProbe still reports 7 raw fpvectorial failures (by design)"
        shell: pwsh
        run: |
          $out = ./Tests/FpcCoreTests/svg/RasterProbe.exe 2>&1 | Out-String
          $out
          # WHITESPACE-TOLERANT, and it has to be.
          #
          # The probe prints a column-aligned line
          #     rendered ok      : 110
          # (six spaces before the colon, because the neighbouring label
          # "parse/raise fail" is longer). The assertion used to be a literal
          # 'rendered ok : 110' under -notmatch, which cannot match that line,
          # so this step threw on EVERY run and the job could never go green.
          # Measured locally, not reasoned about: -notmatch on the literal is
          # True while the same output matches 'rendered ok\s+: 110'.
          #
          # A check that can never pass is the same defect as one that can
          # never fail -- it teaches the reader to ignore the badge.
          if ($out -notmatch 'rendered ok\s+:\s*110') {
            throw "expected 110/117 to render when bypassing the control"
          }
          if ($out -notmatch 'RESULT: INCOMPLETE') {
            throw "RasterProbe must still report INCOMPLETE; it bypasses the normaliser"
          }
          if ($out -notmatch 'parse/raise fail\s*:\s*7') {
            throw "expected exactly 7 zero-chord payloads to fail without the normaliser"
          }

      # ImgCollProbe is the runtime answer for the OTHER step-3 conversion.
      # Where RasterProbe deliberately bypasses its control, this one does not:
      # it streams the fragment the converter actually wrote, through the real
      # LCL reader, and then checks that each of the 20 extracted PNGs decodes
      # to the size the manifest recorded AND has at least one non-transparent
      # pixel. "Decodes, right size, right index bound, and is not blank" is
      # four separate claims; the first three pass on an all-black image.
      #
      # It takes under a second, and it is the only check anywhere that would
      # have noticed that `TBitmap.Assign` cannot accept a decoded PNG.
      - name: "the converted ImageCollections.lfm loads and every PNG has ink"
        shell: pwsh
        run: ./Tests/FpcCoreTests/imgcoll/ImgCollProbe.exe

      # -------------------------------------------------------------------------
      # The two FORM probes. Everything above proves the data is intact; these
      # two prove the converted FILES are loadable, which is the claim the whole
      # F3 estimate rests on and which no text gate can make.
      #
      # They need the LCL built (this job's first step) and the SynEdit units,
      # which is why they live here rather than in a job of their own: a second
      # job would build the same two packages again for the same machine.
      # -------------------------------------------------------------------------
      - name: "Build the form probes (FormLfmProbe, PropRttiProbe)"
        shell: pwsh
        run: ./tools/build_form_probe.ps1 -Target all

      # PropRttiProbe first, because its failures explain FormLfmProbe's: it
      # reports, per property, whether the reader takes it, with the reader's
      # own message. It self-tests first -- a harness that refuses everything
      # looks exactly like a result -- and audits the property-to-skip registry
      # for entries naming a property the LCL can actually take.
      #
      # Its count of "unmodelled" collection blocks and item rows is NOT a
      # failure: those contents belong to item classes this scanner does not
      # model, and attributing them to the enclosing object is what made it
      # report two phantom refusals (`TSynEdit.Command`, `TSynEdit.ShortCut`)
      # in F3-6. FormLfmProbe below is the authority for them, because it
      # streams the real files.
      - name: "every converted property is one the LCL reader takes (expect 0 refused)"
        shell: pwsh
        run: ./Tests/FpcCoreTests/forms/PropRttiProbe.exe

      # The headline result of the F3 work: all 14 forms the route tool calls
      # CLEARED stream through the real LCL reader, as the class and under the
      # name the DFM declared, with owned components AND parented controls, and
      # the two frame-bearing forms go through the full Delphi embedded-frame
      # protocol (inline frame + inherited children resolved by name from the
      # frame's own registered resource).
      #
      # 14 as of Sprint F3-6, which retired the vendored TSynCppSyn in favour
      # of the LCL's own SynHighlighterCpp and so unblocked EditorOptFrm -- the
      # first CLEARED form to carry a syntax highlighter, a TSynStringGrid and
      # a TColorBox. The number is never typed here on trust: EXPECTED in
      # FormProbeSupport.pas is the route tool's CLEARED set, and the two
      # disagreeing is itself the finding.
      - name: "all 14 CLEARED forms load through the real LCL reader"
        shell: pwsh
        run: ./Tests/FpcCoreTests/forms/FormLfmProbe.exe

      # -------------------------------------------------------------------------
      # TSynRCSyn. F3-7's decision was to write a NATIVE LCL highlighter rather
      # than port the vendored 537-line one, so this probe is what makes that
      # decision checkable instead of plausible. LCL 4.4 has SynHighlighterCpp
      # but no synhighlighterrc at all, and Source/DataFrm.dfm declares
      # `object Res: TSynRCSyn`, so the class has to exist and behave.
      #
      # "Loads" is the weak claim and it is NOT what this gate asserts: the real
      # highlighter emits 54 tokens across 7 distinct kinds on a realistic .rc,
      # which a stub returning tkUnknown cannot do. The eight DirecAttri-style
      # published properties are also checked for RESOLVABILITY via
      # GetDefaultAttribute, which is a strictly stronger claim than
      # "assignable" -- and it is a real one, because SYN_ATTR_DIRECTIVE was
      # missing from that case list while every property was still assignable.
      #
      # It self-tests first, and the anti-vacuity case comes before the broken
      # ones on purpose: a matcher that rejected every possible output would
      # otherwise pass a self-test built only from broken highlighters.
      - name: "Build SynRcProbe"
        shell: pwsh
        run: ./tools/build_syn_probe.ps1

      - name: "the native LCL RC highlighter loads AND tokenises"
        shell: pwsh
        run: ./Tests/FpcCoreTests/syn/SynRcProbe.exe

      # -------------------------------------------------------------------------
      # main.pas's blocker list, split into SPELLING and REAL WORK (F3-8).
      #
      # Sections 18 and 19.8 recommended attacking main.pas rather than
      # inverting the MainUi facade. Before that becomes a schedule, the
      # "absent unit" column has to stop mixing two different things: units
      # whose only problem is Delphi's namespace spelling (`System.SysUtils`
      # where FPC wants `SysUtils`), and units that genuinely do not exist here
      # (`Vcl.WinXCtrls`). Measured on the current tree: of 37 absent dotted
      # units in main's closure, 2 already resolve under their dotted names,
      # 22 are spelling alone, and only 13 need real work.
      #
      # It lives HERE, not in the pure-text gate job, because the central claim
      # is verified by COMPILING: the tool generates one program using every
      # group-A unit with its prefix dropped and builds it. "Spelling" therefore
      # means the compiler accepted it, not that the tail resembles a unit
      # somebody has heard of. A text-only job could not establish that, and
      # this is precisely the claim that decides how big the main.pas job is.
      #
      # Only GROWTH fails, same discipline as the compile-surface ratchet. The
      # injection matrix proves it can fail: it repoints the unit search at an
      # empty tree and requires the counts to move.
      - name: "main.pas blockers: namespace spelling vs real work"
        shell: pwsh
        run: python tools/f3_namespace_alias.py --ratchet

      # -------------------------------------------------------------------------
      # The group-A feasibility table, checked against the COMPILER's record
      # rather than against a regex over Pascal text.
      #
      # f3_shim_feasibility.py reads symbols out of unit source, and section 22.3
      # already recorded that failing: FPC's RTL units are `{$I}` shells, so the
      # first run called five real names "unreferenced". This step runs the same
      # classifier twice -- once from source, once from the .ppu the compiler
      # itself produced -- and freezes the outcome.
      #
      # It lives HERE for the same reason the namespace gate does: choosing the
      # .ppu is done by COMPILING a probe with the project's own flags and
      # reading `PPU Loading` back out of `fpc -vt`. There are three copies of
      # sysutils.ppu (rtl, rtl-objpas, rtl-unicode), one per language mode, and
      # picking the wrong one would silently describe a different build.
      #
      # The ratchet fails on growth of the refuted-authorisation set, on any move
      # in a category, and on any disagreement between the two surfaces. Its
      # current known-bad entry is Winapi.Messages, where the source reader says
      # "unused" and the compiler's record holds two constants the tree needs.
      - name: "group-A surface: source text vs the compiler's own .ppu"
        shell: pwsh
        run: |
          python tools/f3_ppu_surface.py --self-test
          python tools/f3_ppu_surface.py --ratchet

      # -------------------------------------------------------------------------
      # The two probes above are gates, and a gate is only as good as its
      # ability to fail. F3-6 found three defects in PropRttiProbe that were all
      # printing healthy numbers over input they had never examined -- the
      # collection guard compared a 2-character substring against a 4-character
      # literal and so could not increment, `ValueLastLine` fed the reader a
      # truncated value that reads as SUCCESS, and item rows were attributed to
      # the enclosing object. So this step breaks each of them on purpose and
      # requires the probe to notice.
      #
      # It re-introduces one registry entry and one survey retirement too, and
      # verifies every restore by MD5. It runs here, after the LCL is built,
      # because two of the four injections need a rebuild -- and the harness
      # ABORTS on a build failure rather than running a stale binary, which is
      # the trap the F3-SVG plan records as its fourth instance.
      - name: "the form and roadmap gates can actually fail (injection matrix)"
        shell: pwsh
        run: python tools/f3_probe_inject.py

  f3-form-ratchet:
    name: F3 form-conversion ratchet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pure text analysis: no Lazarus, no Pascal compiler, no form designer.
      # It answers the question F3's estimate depends on and nothing else --
      # how many of the 53 forms a converter can read unaided.
      - name: "F3 form survey (informational)"
        run: python3 tools/f3_form_survey.py

      # The gate. Fails if the convertible count drops below the recorded
      # baseline, i.e. if a control appears that the Lazarus converter cannot
      # place. Rises are reported but never auto-accepted: recording a higher
      # baseline is a deliberate act, not a side effect.
      - name: "F3 form ratchet (must not regress)"
        run: python3 tools/f3_form_ratchet.py
